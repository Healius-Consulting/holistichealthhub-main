name: Security and verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-firebase-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-project
      VITE_FIREBASE_APP_ID: ci-app-id
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ci-app-check-site-key
      VITE_REQUIRE_APP_CHECK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build:all
      - name: Build Vercel public surface
        run: |
          npm run build:vercel:public
          test -f dist-public/index.html
          test ! -e .vercel-private/index.html
      - name: Build combined Vercel portal
        run: |
          npm run build:vercel:portal
          test ! -f dist-pharmacy/index.html
          test ! -f dist-admin/index.html
          test ! -f dist-portal/index.html
          grep -q "Pharmacy workspace" .vercel-private/pharmacy/index.html
          grep -q "Administration" .vercel-private/admin/index.html
      - run: npm run build --workspace @hhh/web-gateway
      - run: npm test --workspace @hhh/api-sql
      - run: npx tsx --test tests/**/*.test.ts
      - name: Assert production portal boundaries
        run: |
          test ! -f dist-pharmacy/index.html
          test ! -f dist-admin/index.html
          test ! -f dist-portal/index.html
          ! grep -R -q "HHH administration" dist-pharmacy dist-public
          ! grep -R -q "Secure handover" dist-admin dist-public
          ! grep -R -q "Staff sign in" dist-public
          ! grep -R -q "devPortal" dist-public dist-portal
          # The public site must keep recognising printed ?mode=eligibility QR links.
          # The portal bundle must not.
          ! grep -R -q "mode=eligibility" dist-portal
          ! grep -R -q "FIREBASE_SERVICE_ACCOUNT_JSON" dist-public dist-portal
          ! grep -R -q "hpp-sandbox.worldpay.com" services/api-sql
          ! grep -R -q "Guaranteed Try" services/api-sql

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  containers:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-firebase-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-project
      VITE_FIREBASE_APP_ID: ci-app-id
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ci-app-check-site-key
      VITE_REQUIRE_APP_CHECK: "true"
    strategy:
      matrix:
        include:
          - name: api
            command: docker build -f services/api-sql/Dockerfile -t hhh-api:ci .
            image: hhh-api:ci
          - name: public
            command: >-
              docker build -f Dockerfile.web --build-arg SURFACE=public
              --build-arg VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
              --build-arg VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
              --build-arg VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
              --build-arg VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
              --build-arg VITE_FIREBASE_APP_CHECK_SITE_KEY=$VITE_FIREBASE_APP_CHECK_SITE_KEY
              --build-arg VITE_REQUIRE_APP_CHECK=$VITE_REQUIRE_APP_CHECK
              -t hhh-public:ci .
            image: hhh-public:ci
          - name: portal
            command: >-
              docker build -f Dockerfile.web --build-arg SURFACE=portal
              --build-arg VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
              --build-arg VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
              --build-arg VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
              --build-arg VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
              --build-arg VITE_FIREBASE_APP_CHECK_SITE_KEY=$VITE_FIREBASE_APP_CHECK_SITE_KEY
              --build-arg VITE_REQUIRE_APP_CHECK=$VITE_REQUIRE_APP_CHECK
              -t hhh-portal:ci .
            image: hhh-portal:ci
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.command }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The hosted Gitleaks action requires a paid org license. The open-source
      # scanner does not, and .gitleaks.toml still applies the default rules.
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --config .gitleaks.toml --verbose
