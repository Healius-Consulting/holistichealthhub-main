query GetPrescriptionFileById(
  $id: UUID!
  $organisationId: UUID!
) @auth(level: NO_ACCESS) {
  prescriptionFiles(
    where: {
      id: { eq: $id }
      organisationId: { eq: $organisationId }
    }
    limit: 1
  ) {
    id
    organisationId
    patientId
    storagePath
    originalFilename
    contentType
    sizeBytes
    status
    verifiedAt
  }
}

query ListActivePrescribers @auth(level: NO_ACCESS) {
  prescribers(where: { active: { eq: true } }, limit: 200) {
    id
    name
    initials
    pin
    gmcNumber
    gphcNumber
    active
  }
}

