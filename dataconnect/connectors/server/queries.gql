# Server-only Data Connect queries. Auth is fail-closed (NO_ACCESS).
# Runtime SQL API executes matching inline GraphQL in services/api-sql repositories.
# Do not add client-callable or seed/lookup operations that the API does not use.

query GetPortalAdmission(
  $sessionHash: String!
  $staffUid: String!
) @auth(level: NO_ACCESS) {
  staffSession(key: { sessionHash: $sessionHash }) {
    sessionHash
    staffUid
    organisationId
    surface
    role
    userAgentHash
    createdAt
    lastActivityAt
    idleExpiresAt
    absoluteExpiresAt
    revokedAt
    revokeReason
  }
  staffUser(key: { uid: $staffUid }) {
    uid
    organisationId
    email
    displayName
    role
    status
    disabled
  }
}

query GetStaffUserByUid($uid: String!) @auth(level: NO_ACCESS) {
  staffUser(key: { uid: $uid }) {
    uid
    organisationId
    email
    displayName
    role
    status
    disabled
    preferences
    invitedAt
    activatedAt
    lastSignedInAt
    version
  }
}

query GetStaffSessionByHash($sessionHash: String!) @auth(level: NO_ACCESS) {
  staffSession(key: { sessionHash: $sessionHash }) {
    sessionHash
    staffUid
    organisationId
    surface
    role
    userAgentHash
    createdAt
    lastActivityAt
    idleExpiresAt
    absoluteExpiresAt
    revokedAt
    revokeReason
  }
}

query GetOrganisationById($id: UUID!) @auth(level: NO_ACCESS) {
  organisation(key: { id: $id }) {
    id
    companyId
    name
    tradingName
    gphcNumber
    superintendentName
    mainContactName
    mainContactPhone
    mainContactEmail
    address
    primaryColour
    logoText
    status
    classification
    platformFeeMonthlyPence
    portalName
    intakeEnabled
    prescriptionEnabled
    paymentsEnabled
    supplierOrdersEnabled
    patientsEnabled
    resourcesEnabled
    worldpayEnabled
    defaultPaymentRoute
    pharmacyDeliveryEnabled
    autoPlacementEnabled
    gdprComplianceFlag
    pausedReason
    pausedAt
    version
    createdAt
    updatedAt
  }
}

query GetOrganisationDomainByHost($hostname: String!) @auth(level: NO_ACCESS) {
  organisationDomains(where: { hostname: { eq: $hostname } }, limit: 1) {
    id
    organisationId
    hostname
    verifiedAt
  }
}

query GetPharmacyDirectoryByToken($tokenHash: String!) @auth(level: NO_ACCESS) {
  referralTokens(where: { tokenHash: { eq: $tokenHash }, revokedAt: { isNull: true } }, limit: 1) {
    id
    organisationId
    intakeVersion
    organisation {
      id
      name
      tradingName
      gphcNumber
      superintendentName
      address
      primaryColour
      logoText
      status
    }
  }
}

query ListSetupTasksByOrg($organisationId: UUID!) @auth(level: NO_ACCESS) {
