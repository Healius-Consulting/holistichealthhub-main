# Server-only Data Connect mutations. Auth is fail-closed (NO_ACCESS).
# Runtime SQL API executes matching inline GraphQL in services/api-sql repositories.
# Patient activation is ActivateSubmission in intake.sql (patient + identity in one transaction).
# Do not add Direct/seed mutations.

mutation CreateStaffSession(
  $sessionHash: String!
  $staffUid: String!
  $organisationId: UUID
  $surface: String!
  $role: StaffRole!
  $userAgentHash: String!
  $lastActivityAt: Timestamp!
  $idleExpiresAt: Timestamp!
  $absoluteExpiresAt: Timestamp!
) @auth(level: NO_ACCESS) {
  staffSession_insert(data: {
    sessionHash: $sessionHash
    staffUid: $staffUid
    organisationId: $organisationId
    surface: $surface
    role: $role
    userAgentHash: $userAgentHash
    lastActivityAt: $lastActivityAt
    idleExpiresAt: $idleExpiresAt
    absoluteExpiresAt: $absoluteExpiresAt
  })
}

mutation TouchStaffSession(
  $sessionHash: String!
  $lastActivityAt: Timestamp!
  $idleExpiresAt: Timestamp!
) @auth(level: NO_ACCESS) {
  staffSession_update(
    key: { sessionHash: $sessionHash }
    data: {
      lastActivityAt: $lastActivityAt
      idleExpiresAt: $idleExpiresAt
    }
  )
}

mutation RevokeStaffSession(
  $sessionHash: String!
  $revokedAt: Timestamp!
  $revokeReason: String!
) @auth(level: NO_ACCESS) {
  staffSession_update(
    key: { sessionHash: $sessionHash }
    data: {
      revokedAt: $revokedAt
      revokeReason: $revokeReason
    }
  )
}

