mutation UpdatePaymentStatus(
  $id: UUID!
  $status: PaymentStatus!
  $receiptHash: String
  $orderId: UUID!
) @auth(level: NO_ACCESS) {
  payment_update(
    key: { id: $id }
    data: {
      status: $status
      receiptHash: $receiptHash
    }
  )
  order_update(
    key: { id: $orderId }
    data: {
      paymentStatus: $status
      paidAt_expr: "request.time"
    }
  )
}

